# Tests on every push and pull request, the plugin zip as an artifact; a tag v* also publishes a GitHub release with it;
# main is also deployed to GitHub Pages (the standalone app: static files, no build).
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tests/test_build.py checks the version computed from the git history
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: App tests
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: octoprint-plugin/pyproject.toml
      - name: Plugin tests
        run: tools/test_plugin.sh -q

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the zip version (MAJOR.MINOR.PATCH) is computed from the git history
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the plugin zip
        id: build
        run: |
          python3 tools/build_plugin.py | tee "$RUNNER_TEMP/build.log"
          echo "version=$(sed -n 's/.*(version \(.*\))$/\1/p' "$RUNNER_TEMP/build.log")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: OctoPrint-Plotter-${{ steps.build.outputs.version }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OctoPrint-Plotter-${{ needs.build.outputs.version }}
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip --repo "$GITHUB_REPOSITORY" \
            --title "Whoppah $GITHUB_REF_NAME (plugin ${{ needs.build.outputs.version }})" --generate-notes

  pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the standalone app
        # only what the page loads: the page, the standalone env.json, the app sources and the vendored code and fonts
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          cp -r index.html env.json LICENSE src vendor "$RUNNER_TEMP/site/"
          touch "$RUNNER_TEMP/site/.nojekyll"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
      - id: deploy
        uses: actions/deploy-pages@v4
